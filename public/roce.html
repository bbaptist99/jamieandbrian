<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Jamie &amp; Brian | Roce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Great+Vibes&amp;family=Jost:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f0e4; --ink: #502b30; --muted: #765b52; --accent: #6d3038; --line: #d9c9b7;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Jost", Arial, sans-serif;
      --script: "Great Vibes", "Brush Script MT", cursive;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--ink); font: 17px/1.65 var(--sans);
    }
    header { text-align: center; padding: 30px 24px; border-bottom: 1px solid var(--line); }
    .site-title { font: 42px/1 var(--script); color: var(--ink); text-decoration: none; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 70px 24px; text-align: center; }
    .panel { width: 100%; max-width: 560px; }
    .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 18px; color: var(--muted); }
    h1 { font: 400 clamp(64px, 12vw, 110px)/1 var(--script); margin: 0 0 24px; }
    h2 { font: 500 clamp(32px, 5vw, 44px)/1.1 var(--serif); margin: 0 0 26px; }
    .lede { font: italic 26px/1.3 var(--serif); color: var(--muted); margin: 0; }
    .hint { color: var(--muted); margin: 0 0 26px; }
    .gate { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .gate label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .gate input {
      font: inherit; color: var(--ink); background: #fffaf2; border: 1px solid var(--line);
      padding: 12px 16px; min-width: 0; width: 240px; border-radius: 0;
    }
    .gate input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .gate button {
      font: 500 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
      background: var(--accent); color: #fff6e5; border: 1px solid var(--accent); padding: 14px 26px; cursor: pointer;
    }
    .gate button:hover { background: #51252d; }
    .gate button:disabled { opacity: .6; cursor: wait; }
    .error { color: #9b2c2c; min-height: 1.6em; margin: 14px 0 0; font-size: 15px; }
    footer { text-align: center; border-top: 1px solid var(--line); padding: 30px 24px; color: var(--muted); font-size: 12px; letter-spacing: .09em; }
  </style>
</head>
<body>
  <header><a class="site-title" href="/">Jamie &amp; Brian</a></header>

  <main>
    <div class="panel" id="panel">
      <h2>Please enter the password</h2>
      <form class="gate" id="gate">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required autofocus>
        <button type="submit" id="go">Enter</button>
      </form>
      <p class="error" id="error" role="alert"></p>
    </div>
  </main>

  <footer>Jamie &amp; Brian &middot; October 16, 2027</footer>

  <script>
    var LOCKED = {
      salt: "tVcPvaJguwxXsfYxKeRF4A==",
      iv: "gdHxUtrKCNAGDXV8",
      data: "eS4+OOYdwPh18ObRMHtjuhZ5z4KFfJG50EfD+T7qv7T8dFMRdmBcZdM6en4BxlfONhJSQToi6kfKQVe2gwaEt71Wy8sEkS9CeDkkaoIxK2jiMe5gAsayXrxxGOSmTN3NLeN0J65XvYrzN0FZ83MZm1Sg5Rc0LhlJb+oCXynp",
      iterations: 600000
    };
    function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }

    async function unlock(password) {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(LOCKED.salt), iterations: LOCKED.iterations, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.data));
      return new TextDecoder().decode(plain);
    }

    document.getElementById('gate').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('go'), err = document.getElementById('error');
      btn.disabled = true; err.textContent = '';
      try {
        var html = await unlock(document.getElementById('pw').value);
        var panel = document.getElementById('panel');
        panel.innerHTML = html;
        panel.setAttribute('tabindex', '-1');
        panel.focus();
      } catch (_) {
        err.textContent = 'That password didn\u2019t work. Please try again.';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
